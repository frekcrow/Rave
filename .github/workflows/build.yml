name: Build RaveFix dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build RaveFix.dylib (arm64)
        run: make

      - name: Verify Mach-O output
        run: |
          file build/RaveFix.dylib
          otool -L build/RaveFix.dylib
          codesign --force --sign - build/RaveFix.dylib

      - name: Upload RaveFix.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaveFix-dylib
          path: build/RaveFix.dylib
          if-no-files-found: error
